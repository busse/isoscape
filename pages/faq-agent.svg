<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 538" width="400" height="538" role="img" aria-labelledby="agent-t agent-d">
<title id="agent-t">Using isoscape with a coding agent</title>
<desc id="agent-d">Three lanes. You, a person: say what place to draw and how, look at the picture and say what to change. Claude, in the app or a terminal: reads CLAUDE.md, the working contract, and AGENTS.md, and follows the loop. Arrows run down (a request; commands) and back up (pictures and a summary; files and numbers). The repo, isoscape: regions/&lt;name&gt;.json (the place: center, size); fetch (downloads into data/); build &lt;name&gt; --png (out/&lt;name&gt;.png); out/index.html (the explorer, where C compares two builds); npm test and npm run typecheck; npm run check:visual (out/check/index.html). The loop: change, build, look at the picture, compare with the last build, keep or undo.</desc>
