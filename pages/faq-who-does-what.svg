<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="who-t who-d">
<title id="who-t">Who does what</title>
<desc id="who-d">Three lanes. Chris Busse, the artist, decides what to draw and how it should look, sets the rules and limits, looks at every result and decides what to keep. Claude, under his direction, writes and changes the code, runs the builds, tests and checks, and reports what changed with pictures. isoscape, the code, computes the drawing from open data, deterministically: the same data and code give the same SVG, with no image model and no network while it draws. Arrows run down (asks; runs a build) and back up (shows the result; SVG, counts, warnings): the loop of direct, build, look, correct.</desc>
<style>
text{font-family:ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif}
.h{font:600 12px ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;letter-spacing:.08em}
.n{font:700 16px 'Libre Baskerville', Baskerville, Georgia, serif}
.b{font-size:13.5px}
.bb{font-size:13.5px;font-weight:600}
.m{font:12.5px ui-monospace, SFMono-Regular, Menlo, monospace}
.s{font-size:12.5px}
.si{font-size:12.5px;font-style:italic}
.bg{fill:#f4f1ea}.ink{fill:#2c2b33}.dim{fill:#6e6656}.card{fill:#faf7ef}.artist{fill:#f2c879}.agent{fill:#c3d3e2}.code{fill:#d3dfb9}.cache{fill:#a8cad8}.acc{fill:#b5392f}.edge{fill:none;stroke:#2c2b33;stroke-width:1.2}.thin{fill:none;stroke:#2c2b33;stroke-width:0.72}.edge.card{fill:#faf7ef}.edge.cache{fill:#a8cad8}.edge.artist{fill:#f2c879}.edge.agent{fill:#c3d3e2}.edge.code{fill:#d3dfb9}.mark{fill:#f4f1ea;stroke:#2c2b33;stroke-width:1.2}.mark.solid{fill:#2c2b33}.mark.dash{stroke-dasharray:2.6 1.7}.hl{fill:none;stroke:#b5392f;stroke-width:1.68;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){.bg{fill:#14161d}.ink{fill:#c9d1e6}.dim{fill:#8a90a2}.card{fill:#1d2029}.artist{fill:#8a6f3c}.agent{fill:#34465a}.code{fill:#22302a}.cache{fill:#1b2e3b}.acc{fill:#e0614f}.edge{fill:none;stroke:#c9d1e6;stroke-width:1.2}.thin{fill:none;stroke:#c9d1e6;stroke-width:0.72}.edge.card{fill:#1d2029}.edge.cache{fill:#1b2e3b}.edge.artist{fill:#8a6f3c}.edge.agent{fill:#34465a}.edge.code{fill:#22302a}.mark{fill:#14161d;stroke:#c9d1e6;stroke-width:1.2}.mark.solid{fill:#c9d1e6}.mark.dash{stroke-dasharray:2.6 1.7}.hl{fill:none;stroke:#e0614f;stroke-width:1.68;stroke-dasharray:6 4}}
</style>
<rect width="400" height="520" class="bg"/>
<text x="16" y="26" class="h dim">WHO DOES WHAT</text>
<rect x="16" y="40" width="368" height="116" class="edge card"/><circle cx="16" cy="40" r="2.9" class="ink"/><circle cx="384" cy="40" r="2.9" class="ink"/><circle cx="16" cy="156" r="2.9" class="ink"/><circle cx="384" cy="156" r="2.9" class="ink"/><rect x="16" y="40" width="10" height="116" class="edge artist"/><circle cx="26" cy="40" r="2.9" class="ink"/><circle cx="26" cy="156" r="2.9" class="ink"/><text x="40" y="64" class="n ink">Chris Busse</text><text x="372" y="63" class="s ink" text-anchor="end">the artist</text><text x="40" y="88" class="b ink">Decides what to draw, and how it should look</text><text x="40" y="107" class="b ink">Sets the rules and limits the work follows</text><text x="40" y="126" class="b ink">Looks at every result, sends back what is</text><text x="40" y="145" class="b ink">wrong, and decides what to keep</text>
<path d="M64 162L64 198" class="edge"/><path d="M64 206L59.8 198L68.2 198Z" class="ink"/><circle cx="64" cy="162" r="2.3" class="ink"/><text x="78" y="188.5" class="s dim">asks, in words</text><path d="M238 206L238 170" class="edge"/><path d="M238 162L242.2 170L233.8 170Z" class="ink"/><circle cx="238" cy="206" r="2.3" class="ink"/><text x="252" y="188.5" class="s dim">shows the result</text>
<rect x="16" y="212" width="368" height="97" class="edge card"/><circle cx="16" cy="212" r="2.9" class="ink"/><circle cx="384" cy="212" r="2.9" class="ink"/><circle cx="16" cy="309" r="2.9" class="ink"/><circle cx="384" cy="309" r="2.9" class="ink"/><rect x="16" y="212" width="10" height="97" class="edge agent"/><circle cx="26" cy="212" r="2.9" class="ink"/><circle cx="26" cy="309" r="2.9" class="ink"/><text x="40" y="236" class="n ink">Claude</text><text x="372" y="235" class="s ink" text-anchor="end">under Chris's direction</text><text x="40" y="260" class="b ink">Writes and changes the code</text><text x="40" y="279" class="b ink">Runs the builds, the tests and the checks</text><text x="40" y="298" class="b ink">Reports what changed, with pictures</text>
<path d="M64 315L64 351" class="edge"/><path d="M64 359L59.8 351L68.2 351Z" class="ink"/><circle cx="64" cy="315" r="2.3" class="ink"/><text x="78" y="341.5" class="s dim">runs a build</text><path d="M238 359L238 323" class="edge"/><path d="M238 315L242.2 323L233.8 323Z" class="ink"/><circle cx="238" cy="359" r="2.3" class="ink"/><text x="252" y="341.5" class="s dim">SVG, counts, warnings</text>
<rect x="16" y="365" width="368" height="97" class="edge card"/><circle cx="16" cy="365" r="2.9" class="ink"/><circle cx="384" cy="365" r="2.9" class="ink"/><circle cx="16" cy="462" r="2.9" class="ink"/><circle cx="384" cy="462" r="2.9" class="ink"/><rect x="16" y="365" width="10" height="97" class="edge code"/><circle cx="26" cy="365" r="2.9" class="ink"/><circle cx="26" cy="462" r="2.9" class="ink"/><text x="40" y="389" class="n ink">isoscape</text><text x="372" y="388" class="s ink" text-anchor="end">the code</text><text x="40" y="413" class="b ink">Computes the drawing from open data</text><text x="40" y="432" class="b ink">Same data and code in, same SVG out</text><text x="40" y="451" class="b ink">No image model; no network while it draws</text>
<text x="16" y="486" class="si ink">The loop: direct, build, look, correct.</text>
<text x="16" y="504" class="si ink">Nothing is kept until Chris approves it.</text>
</svg>
