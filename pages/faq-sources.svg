<rect x="16" y="44" width="368" height="93" class="edge card"/><circle cx="16" cy="44" r="2.9" class="ink"/><circle cx="384" cy="44" r="2.9" class="ink"/><circle cx="16" cy="137" r="2.9" class="ink"/><circle cx="384" cy="137" r="2.9" class="ink"/>
<text x="28" y="65" class="bb ink">OpenStreetMap</text>
<circle cx="36" cy="82.4" r="5.2" class="mark solid"/>
<text x="50" y="87" class="b ink">Streets, rail, water, parks, building outlines</text>
<circle cx="36" cy="103.4" r="5.2" class="mark solid"/>
<text x="50" y="108" class="b ink">Building heights, where mappers tagged them</text>
<circle cx="36" cy="124.4" r="5.2" class="mark dash"/>
<text x="50" y="129" class="b ink">Other heights, from building type and size</text>
<rect x="16" y="151" width="368" height="72" class="edge card"/><circle cx="16" cy="151" r="2.9" class="ink"/><circle cx="384" cy="151" r="2.9" class="ink"/><circle cx="16" cy="223" r="2.9" class="ink"/><circle cx="384" cy="223" r="2.9" class="ink"/>
<text x="28" y="172" class="bb ink">USGS 3DEP lidar</text>
<text x="372" y="172" class="s ink" text-anchor="end">or a national model</text>
<circle cx="36" cy="189.4" r="5.2" class="mark solid"/>
<text x="50" y="194" class="b ink">The ground: hills, banks, the riverbed</text>
<circle cx="36" cy="210.4" r="5.2" class="mark"/>
