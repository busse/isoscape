<rect x="16" y="237" width="368" height="51" class="edge card"/><circle cx="16" cy="237" r="2.9" class="ink"/><circle cx="384" cy="237" r="2.9" class="ink"/><circle cx="16" cy="288" r="2.9" class="ink"/><circle cx="384" cy="288" r="2.9" class="ink"/>
<text x="28" y="258" class="bb ink">Microsoft footprints</text>
<text x="372" y="258" class="s ink" text-anchor="end">Gwynn's Island</text>
<circle cx="36" cy="275.4" r="5.2" class="mark"/>
<text x="50" y="280" class="b ink">Buildings OSM lacks, traced by a model</text>
<rect x="16" y="302" width="368" height="51" class="edge card"/><circle cx="16" cy="302" r="2.9" class="ink"/><circle cx="384" cy="302" r="2.9" class="ink"/><circle cx="16" cy="353" r="2.9" class="ink"/><circle cx="384" cy="353" r="2.9" class="ink"/>
<text x="28" y="323" class="bb ink">NLCD land cover</text>
<text x="372" y="323" class="s ink" text-anchor="end">Gwynn's Island</text>
<circle cx="36" cy="340.4" r="5.2" class="mark"/>
<text x="50" y="345" class="b ink">Woods, fields and wetlands, from satellites</text>
<rect x="16" y="367" width="368" height="51" class="edge card"/><circle cx="16" cy="367" r="2.9" class="ink"/><circle cx="384" cy="367" r="2.9" class="ink"/><circle cx="16" cy="418" r="2.9" class="ink"/><circle cx="384" cy="418" r="2.9" class="ink"/>
<text x="28" y="388" class="bb ink">City year-built records</text>
<text x="372" y="388" class="s ink" text-anchor="end">Richmond</text>
<circle cx="36" cy="405.4" r="5.2" class="mark solid"/>
<text x="50" y="410" class="b ink">The year each standing building went up</text>
<rect x="16" y="432" width="368" height="72" class="edge card"/><circle cx="16" cy="432" r="2.9" class="ink"/><circle cx="384" cy="432" r="2.9" class="ink"/><circle cx="16" cy="504" r="2.9" class="ink"/><circle cx="384" cy="504" r="2.9" class="ink"/>
<text x="28" y="453" class="bb ink">Sanborn maps</text>
<text x="372" y="453" class="s ink" text-anchor="end">Library of Congress</text>
<circle cx="36" cy="470.4" r="5.2" class="mark"/>
<text x="50" y="475" class="b ink">Lost buildings, traced from the scans</text>
<circle cx="36" cy="491.4" r="5.2" class="mark dash"/>
<text x="50" y="496" class="b ink">Their heights, from their material</text>
<rect x="16" y="518" width="368" height="51" class="edge card"/><circle cx="16" cy="518" r="2.9" class="ink"/><circle cx="384" cy="518" r="2.9" class="ink"/><circle cx="16" cy="569" r="2.9" class="ink"/><circle cx="384" cy="569" r="2.9" class="ink"/>
<text x="28" y="539" class="bb ink">Rules in the code</text>
<circle cx="36" cy="556.4" r="5.2" class="mark dash"/>
<text x="50" y="561" class="b ink">Bridge deck heights, by name or layer</text>
<circle cx="24" cy="592.4" r="5.2" class="mark solid"/>
<text x="37" y="597" class="b ink">measured</text>
<circle cx="136" cy="592.4" r="5.2" class="mark"/>
<text x="149" y="597" class="b ink">inferred</text>
<circle cx="248" cy="592.4" r="5.2" class="mark dash"/>
<text x="261" y="597" class="b ink">guessed</text>
<text x="16" y="619" class="si dim">The same marks as on the cutaway sheets.</text>
</svg>
