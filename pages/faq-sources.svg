<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 633" width="400" height="633" role="img" aria-labelledby="src-t src-d">
<title id="src-t">Where the geometry comes from</title>
<desc id="src-d">Seven sources and what each one gives. A solid disc means measured, a ring inferred, a dashed ring guessed. OpenStreetMap: streets, rail, water, parks and building outlines, measured; building heights where mappers tagged them, measured; other heights, guessed from building type and size. USGS 3DEP lidar, or a national elevation model: the ground, measured; the river surface, rocks, rapids and shoreline, inferred. Microsoft building footprints, used on Gwynn's Island: buildings OpenStreetMap lacks, traced by a model, inferred. NLCD land cover, on Gwynn's Island: woods, fields and wetlands from satellites, inferred. City of Richmond year-built records: the year each standing building went up, measured. Sanborn fire-insurance maps from the Library of Congress: lost buildings traced from the scans, inferred; their heights from their material, guessed. Rules in the code: bridge deck heights by name or layer, guessed.</desc>
<style>
text{font-family:ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif}
.h{font:600 12px ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;letter-spacing:.08em}
.n{font:700 16px 'Libre Baskerville', Baskerville, Georgia, serif}
.b{font-size:13.5px}
.bb{font-size:13.5px;font-weight:600}
.m{font:12.5px ui-monospace, SFMono-Regular, Menlo, monospace}
.s{font-size:12.5px}
.si{font-size:12.5px;font-style:italic}
.bg{fill:#f4f1ea}.ink{fill:#2c2b33}.dim{fill:#6e6656}.card{fill:#faf7ef}.artist{fill:#f2c879}.agent{fill:#c3d3e2}.code{fill:#d3dfb9}.cache{fill:#a8cad8}.acc{fill:#b5392f}.edge{fill:none;stroke:#2c2b33;stroke-width:1.2}.thin{fill:none;stroke:#2c2b33;stroke-width:0.72}.edge.card{fill:#faf7ef}.edge.cache{fill:#a8cad8}.edge.artist{fill:#f2c879}.edge.agent{fill:#c3d3e2}.edge.code{fill:#d3dfb9}.mark{fill:#f4f1ea;stroke:#2c2b33;stroke-width:1.2}.mark.solid{fill:#2c2b33}.mark.dash{stroke-dasharray:2.6 1.7}.hl{fill:none;stroke:#b5392f;stroke-width:1.68;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){.bg{fill:#14161d}.ink{fill:#c9d1e6}.dim{fill:#8a90a2}.card{fill:#1d2029}.artist{fill:#8a6f3c}.agent{fill:#34465a}.code{fill:#22302a}.cache{fill:#1b2e3b}.acc{fill:#e0614f}.edge{fill:none;stroke:#c9d1e6;stroke-width:1.2}.thin{fill:none;stroke:#c9d1e6;stroke-width:0.72}.edge.card{fill:#1d2029}.edge.cache{fill:#1b2e3b}.edge.artist{fill:#8a6f3c}.edge.agent{fill:#34465a}.edge.code{fill:#22302a}.mark{fill:#14161d;stroke:#c9d1e6;stroke-width:1.2}.mark.solid{fill:#c9d1e6}.mark.dash{stroke-dasharray:2.6 1.7}.hl{fill:none;stroke:#e0614f;stroke-width:1.68;stroke-dasharray:6 4}}
</style>
