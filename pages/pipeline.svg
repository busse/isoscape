<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The isoscape pipeline</title>
<desc id="d">fetch: a region config drives downloads from OpenStreetMap and USGS 3DEP into a local cache. build: the cache is parsed, projected, given terrain, turned into a scene, sorted, drawn as SVG, archived, and listed in the explorer.</desc>
<style>
.b{fill:#fbfaf7;stroke:#26252b;stroke-width:1.2}
.k{fill:#dcebf2;stroke:#2f6f8f;stroke-width:1.2}
.t{fill:#26252b;font-size:13px;font-weight:600}
.s{fill:#77737a;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.l{fill:#77737a;font-size:12px;font-style:italic}
.a{fill:none;stroke:#77737a;stroke-width:1.2;marker-end:url(#h)}
.h{fill:#77737a}
.dot{fill:#26252b}
@media (prefers-color-scheme: dark){
.b{fill:#1b1d23;stroke:#e5e6ec}.k{fill:#22323d;stroke:#7fb6d4}.t{fill:#e5e6ec}.s,.l{fill:#9497a3}.a{stroke:#9497a3}.h{fill:#9497a3}.dot{fill:#e5e6ec}
}
</style>
<defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="h" d="M0 0L8 4L0 8z"/></marker></defs>

<text class="l" x="10" y="14">fetch — the only step that touches the network</text>
<rect class="b" x="10" y="38" width="160" height="46" rx="5"/>
<text class="t" x="20" y="57">Region config</text><text class="s" x="20" y="74">regions/&lt;name&gt;.json</text>
<rect class="b" x="240" y="24" width="170" height="40" rx="5"/>
<text class="t" x="250" y="41">OpenStreetMap</text><text class="s" x="250" y="56">Overpass, in tiles</text>
<rect class="b" x="240" y="72" width="170" height="40" rx="5"/>
<text class="t" x="250" y="89">USGS 3DEP elevation</text><text class="s" x="250" y="104">exportImage, in tiles</text>
<rect class="k" x="480" y="44" width="180" height="46" rx="5"/>
<text class="t" x="490" y="63">Local cache</text><text class="s" x="490" y="80">data/&lt;name&gt;/</text>
<path class="a" d="M170 55L238 45"/><path class="a" d="M170 68L238 90"/>
<path class="a" d="M410 45L478 60"/><path class="a" d="M410 92L478 76"/>

<text class="l" x="64" y="141">build — offline, from the cache; every build is archived</text>
<path class="a" d="M570 90V122H52V148"/>
<g transform="translate(10 150)">
<rect class="b" x="0" width="84" height="46" rx="5"/><text class="t" x="8" y="19">Parse</text><text class="s" x="8" y="36">osm.ts</text>
<rect class="b" x="94" width="84" height="46" rx="5"/><text class="t" x="102" y="19">Camera</text><text class="s" x="102" y="36">view.ts</text>
<rect class="b" x="188" width="84" height="46" rx="5"/><text class="t" x="196" y="19">Terrain</text><text class="s" x="196" y="36">terrain.ts</text>
<rect class="b" x="282" width="84" height="46" rx="5"/><text class="t" x="290" y="19">Scene</text><text class="s" x="290" y="36">scene.ts</text>
<rect class="b" x="376" width="84" height="46" rx="5"/><text class="t" x="384" y="19">Order</text><text class="s" x="384" y="36">order.ts</text>
<rect class="b" x="470" width="84" height="46" rx="5"/><text class="t" x="478" y="19">Draw</text><text class="s" x="478" y="36">render.ts</text>
<rect class="k" x="564" width="84" height="46" rx="5"/><text class="t" x="572" y="19">Archive</text><text class="s" x="572" y="36">archive.ts</text>
<rect class="k" x="658" width="84" height="46" rx="5"/><text class="t" x="666" y="19">Explorer</text><text class="s" x="666" y="36">explorer.ts</text>
<path class="a" d="M84 23H92"/><path class="a" d="M178 23H186"/><path class="a" d="M272 23H280"/><path class="a" d="M366 23H374"/>
<path class="a" d="M460 23H468"/><path class="a" d="M554 23H562"/><path class="a" d="M648 23H656"/>
</g>
<circle class="dot" cx="10" cy="38" r="2"/><circle class="dot" cx="170" cy="38" r="2"/><circle class="dot" cx="10" cy="84" r="2"/><circle class="dot" cx="170" cy="84" r="2"/>
<text class="l" x="10" y="222">The SVG lands in out/&lt;name&gt;.svg and out/builds/&lt;id&gt;/, with a thumbnail and meta.json; out/index.html is rewritten.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
