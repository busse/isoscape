<rect x="16" y="346" width="368" height="97" class="edge card"/><circle cx="16" cy="346" r="2.9" class="ink"/><circle cx="384" cy="346" r="2.9" class="ink"/><circle cx="16" cy="443" r="2.9" class="ink"/><circle cx="384" cy="443" r="2.9" class="ink"/><rect x="16" y="346" width="10" height="97" class="edge code"/><circle cx="26" cy="346" r="2.9" class="ink"/><circle cx="26" cy="443" r="2.9" class="ink"/><text x="40" y="370" class="n ink">isoscape</text><text x="372" y="369" class="s ink" text-anchor="end">the code</text><text x="40" y="394" class="b ink">Turns the data into the SVG</text><text x="40" y="413" class="b ink">the same way every time</text><text x="40" y="432" class="b ink">Uses no image model and no network</text>
</svg>
