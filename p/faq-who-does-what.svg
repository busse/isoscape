<rect x="16" y="193" width="368" height="97" class="edge card"/><circle cx="16" cy="193" r="2.9" class="ink"/><circle cx="384" cy="193" r="2.9" class="ink"/><circle cx="16" cy="290" r="2.9" class="ink"/><circle cx="384" cy="290" r="2.9" class="ink"/><rect x="16" y="193" width="10" height="97" class="edge agent"/><circle cx="26" cy="193" r="2.9" class="ink"/><circle cx="26" cy="290" r="2.9" class="ink"/><text x="40" y="217" class="n ink">Claude</text><text x="372" y="216" class="s ink" text-anchor="end">under Chris's direction</text><text x="40" y="241" class="b ink">Writes and changes the code</text><text x="40" y="260" class="b ink">Runs the builds and the checks</text><text x="40" y="279" class="b ink">Shows Chris what changed</text>
