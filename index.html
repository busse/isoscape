<style>
:root {
  --bg: #f4f2ed; --panel: #fbfaf7; --line: #e2ded5; --ink: #26252b; --dim: #77737a; --faint: #a7a2a6;
  --accent: #2f6f8f; --accent-soft: #dcebf2; --stage: #e7e4dc; --chip: #efece5; --good: #3c7a4a; --bad: #a3473a; --warn: #b8860b;
  font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15161b; --panel: #1b1d23; --line: #2b2e37; --ink: #e5e6ec; --dim: #9497a3; --faint: #646875;
    --accent: #7fb6d4; --accent-soft: #22323d; --stage: #101115; --chip: #252831; --good: #7fc28f; --bad: #e08c7e; --warn: #f2c94c; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 100%; overflow: hidden; }
button { font: inherit; color: inherit; }
kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--dim); }

/* ---- nav ---------------------------------------------------------------- */
#nav { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
#nav header { padding: 14px 16px 10px; display: flex; align-items: baseline; gap: 8px; }
#nav header b { font-size: 15px; letter-spacing: -.01em; }
#nav header span { color: var(--dim); }
#nav header .count { margin-left: auto; font-size: 12px; color: var(--faint); }
#nav a.shop { display: block; margin: 0 16px 8px; padding: 6px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); text-decoration: none; font-weight: 600; }
#nav a.shop:hover { background: var(--accent); color: var(--panel); }
#filter { margin: 0 12px 10px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; outline: none; }
#filter:focus { border-color: var(--accent); }
#list { overflow-y: auto; flex: 1; padding: 0 8px 16px; }
#list h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 8px 6px; }
#list h2 small { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); font-size: 11px; }
.build { display: grid; grid-template-columns: 76px 1fr; gap: 10px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 7px; background: none; text-align: left; cursor: pointer; align-items: center; }
.build:hover { background: var(--chip); }
.build.a { background: var(--accent-soft); border-color: var(--accent); }
.build.b { border-color: var(--accent); border-style: dashed; }
.thumb { width: 76px; height: 46px; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; object-position: center 60%; display: block; }
.swatch { width: 76px; height: 46px; border-radius: 4px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: #888; }
.build .top { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.build .note { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.build .sub { font-size: 11px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.big { color: var(--warn); cursor: help; }
.tag { font-size: 10.5px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--dim); }
.tag.ab { background: var(--accent); color: var(--panel); font-weight: 600; }
time { color: var(--dim); margin-left: auto; font-size: 11px; }
.tag.yr { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
#timeline { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; pointer-events: none; }
#timeline[hidden] { display: none; }
#timeline button { pointer-events: auto; font: 600 12px ui-sans-serif, system-ui, sans-serif; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
#timeline button:hover { border-color: var(--accent); }
#timeline button.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
#timeline .hint { pointer-events: none; font-size: 11px; color: var(--faint); margin-left: 6px; }
.story ul.sources { font-size: 12px; color: var(--dim); }
#nav footer { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; line-height: 1.7; }
#nav footer a { color: var(--dim); }

/* ---- main ---------------------------------------------------------------- */
main { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
#stage { position: relative; overflow: hidden; background: var(--stage); cursor: grab; touch-action: none; user-select: none; }
#stage.dragging { cursor: grabbing; }
#stage img { position: absolute; max-width: none; pointer-events: none; image-rendering: auto; }
#clipB { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#divider { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); cursor: ew-resize; display: none; }
#divider::after { content: "A │ B"; position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--accent); color: var(--panel); }
#divider::before { content: ""; position: absolute; inset: 0 -8px; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 40px; }
#toolbar { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; }
#toolbar button, #toolbar select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; color: var(--ink); }
#toolbar button.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
#toolbar .zoom { font-variant-numeric: tabular-nums; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-width: 56px; text-align: center; }
#loading { position: absolute; left: 12px; top: 12px; font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; display: none; }

/* ---- info ---------------------------------------------------------------- */
#info { border-top: 1px solid var(--line); background: var(--panel); max-height: 38vh; overflow: auto; }
#info.closed .body { display: none; }
#info .bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); }
#info .bar h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#info .bar .links { margin-left: auto; display: flex; gap: 12px; white-space: nowrap; }
#info .bar a { color: var(--accent); text-decoration: none; font-size: 12px; }
#info .bar button { border: none; background: none; cursor: pointer; color: var(--dim); }
#info .body { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.4fr) minmax(240px, 1fr); gap: 22px; padding: 12px 16px 16px; }
#info h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
dt { color: var(--dim); }
dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; color: var(--dim); font-weight: 400; }
th { font-weight: 600; font-size: 11px; color: var(--dim); }
td.up { color: var(--good); } td.down { color: var(--bad); }
#info .settings table { table-layout: fixed; }
#info .settings td { white-space: normal; overflow-wrap: anywhere; text-align: left; }
#info .settings td:first-child { width: 38%; }
pre { margin: 0; font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 26vh; overflow: auto; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.dirty { color: var(--bad); }

/* ---- pages: nav ---------------------------------------------------------------- */
#pages { padding: 0 8px 8px; }
#pages a { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; }
#pages a:hover { background: var(--chip); }
#pages a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#pages a::before { content: "§"; color: var(--faint); font-weight: 400; width: 10px; }
#pages a.on::before { color: var(--accent); }

/* ---- pages: reading view --------------------------------------------------------- */
#page { display: none; overflow-y: auto; background: var(--panel); min-height: 0; }
body.reading #stage, body.reading #info { display: none; }
body.reading #page { display: block; }
body.reading main { grid-template-rows: 1fr; }
.doc { display: grid; grid-template-columns: minmax(0, 70ch) 220px; gap: 56px; justify-content: center; padding: 28px 40px 80px; }
@media (max-width: 1180px) { .doc { grid-template-columns: minmax(0, 70ch); } #toc { display: none; } }
.doc .back { display: inline-block; margin-bottom: 18px; font-size: 12.5px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 14px; padding: 3px 11px; background: var(--bg); cursor: pointer; }
.doc .back:hover { border-color: var(--accent); }
.prose { font-size: 15.5px; line-height: 1.65; color: var(--ink); min-width: 0; }
.prose h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 18px; font-weight: 650; }
.prose h2 { font-size: 20px; letter-spacing: -.01em; margin: 2.2em 0 .5em; padding-top: .6em; border-top: 1px solid var(--line); font-weight: 650; }
.prose h3 { font-size: 16px; margin: 1.6em 0 .4em; }
.prose h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 1.5em 0 .3em; }
.prose h2, .prose h3 { scroll-margin-top: 16px; }
.prose p, .prose ul, .prose ol, .prose blockquote, .prose .table, .prose pre { margin: 0 0 1em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: .25em 0; }
.prose li::marker { color: var(--faint); }
.prose a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; }
.prose a:hover { text-decoration-color: var(--accent); }
.prose code { font: .86em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); padding: .05em .25em; border-radius: 4px; }
.prose pre { max-height: none; font-size: 12.5px; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose blockquote { margin-left: 0; padding: .5em 1em; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 6px 6px 0; }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose img { display: block; max-width: 100%; height: auto; margin: 1.4em auto; }
.prose hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
.prose .table { overflow-x: auto; }
.prose table { font-size: 13.5px; font-variant-numeric: normal; }
.prose th, .prose td { text-align: left; white-space: normal; vertical-align: top; padding: 6px 10px 6px 0; color: var(--ink); }
.prose th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); border-bottom: 1.5px solid var(--line); }
.prose td:first-child { color: var(--ink); font-weight: 500; }
.prose .source { margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); }
#toc { position: sticky; top: 28px; align-self: start; font-size: 12.5px; max-height: calc(100vh - 56px); overflow-y: auto; }
#toc h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 6px 0 8px; }
#toc a { display: block; padding: 3px 0 3px 10px; border-left: 2px solid var(--line); color: var(--dim); text-decoration: none; }
#toc a:hover { color: var(--ink); }
#toc a.on { color: var(--accent); border-left-color: var(--accent); }

/* ---- info: tabs and the per-build story ---------------------------------------- */
#info .tabs { display: flex; gap: 2px; margin-left: 8px; }
#info .bar .tabs button { padding: 2px 10px; border-radius: 12px; font-size: 12px; color: var(--dim); }
#info .bar .tabs button:hover { color: var(--ink); background: var(--chip); }
#info .bar .tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#info.made { max-height: 52vh; }
#info .body.stories { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 40px; padding: 14px 24px 22px; }
.story { font-size: 13.5px; line-height: 1.6; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 0 36px; align-content: start; }
.story > h3, .story > .lede, .story > .credit { grid-column: 1 / -1; }
.story section { max-width: 72ch; }
.story h3 { margin: 0 0 8px; }
.story h4 { font-size: 13px; margin: 12px 0 3px; font-weight: 600; }
.story h4 a { font-weight: 400; font-size: 11.5px; margin-left: 6px; }
.story p { margin: 0 0 6px; }
.story ul { margin: 0 0 6px; padding-left: 1.2em; }
.story li { margin: 2px 0; }
.story a { color: var(--accent); text-decoration: none; }
.story a:hover { text-decoration: underline; }
.story .lede { font-size: 14.5px; max-width: 110ch; margin-bottom: 2px; }
.story .unknown { color: var(--faint); }
.story code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); padding: 0 4px; border-radius: 3px; }
.story .credit { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.mixbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; max-width: 360px; background: var(--chip); }
.mixbar span { display: block; height: 100%; }
.m-tag { background: var(--good); } .m-model { background: #8a7bb8; } .m-lev { background: var(--accent); } .m-guess { background: var(--faint); }
.doc .back[hidden] { display: none; }
#page:focus { outline: none; }
.story ul.keyed { list-style: none; padding-left: 0; }
.key { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>

<script type="application/json" id="pagesData">[{"slug":"artist-statement","title":"Artist statement","summary":"Why Chris Busse makes these maps, in his own words.","file":"pages/artist-statement.md","html":"\u003ch1 id=\"p-artist-statement-artist-statement\">Artist statement\u003c/h1>\n\u003cp>I&#39;ve been drawn to maps for as long as I can remember. I collect historic maps of Richmond and the counties around it. As a kid I spent a lot of time exploring the swamps of western Henrico, with USGS topo maps and old coal field, mine and railroad maps to find my way. The contours of the land, and what covers it, have fascinated me ever since.\u003c/p>\n\u003cp>Place is part of the context for my photography too, both digital and film. Over time I&#39;ve come to think of maps as taxonomies. They sort the world into kinds, like which road is bigger, which building is a church and which is a warehouse. They also feed other taxonomies. A photograph gets cataloged by where it was made, and the map is part of how we find it again.\u003c/p>\n\u003cp>isoscape started as a way to draw places I know from open map data, in a small isometric style that lets you take in a whole neighborhood at once. For Richmond I also traced old fire-insurance maps, so you can watch blocks change over more than a hundred years. The drawings are sketches. Buildings are approximate, and some are missing.\u003c/p>\n\u003cp>I built it with AI, mostly Claude, in an ordinary chat window. I gave a talk about working this way at AI Ready RVA in October, \u003ca href=\"https://github.com/busse/talk-2610-airva\" target=\"_blank\" rel=\"noopener\">Humans, Art, Tools, and AI\u003c/a>. My view is that the tool doesn&#39;t make the art. I set the rules and the limits, look at what comes back, and decide what to keep. Most of the work on isoscape was exactly that: writing down what a good map should look like, and throwing out the ones that weren&#39;t. The code is free and open, so you can do the same for places you care about.\u003c/p>\n\u003cp>I&#39;m treating all of this as a warm-up. In 2027 I&#39;m working on several projects about images, history, place, how we catalog things, and how things change. I want to see what new tools, AI included, can turn up at the seams and boundaries of experience and memory, and in how we tell stories about where we&#39;ve been.\u003c/p>\n\u003cp>— Chris Busse, Richmond, Virginia\u003c/p>\n\u003ch2 id=\"p-artist-statement-elsewhere\">Elsewhere\u003c/h2>\n\u003cul>\u003cli>Prints, puzzles and gifts of these maps: \u003ca href=\"https://chrisbusse.com\" target=\"_blank\" rel=\"noopener\">chrisbusse.com\u003c/a>\u003c/li>\u003cli>Writing: \u003ca href=\"https://fullbacklog.com\" target=\"_blank\" rel=\"noopener\">fullbacklog.com\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/how-its-made\">How it&#39;s made\u003c/a> · \u003ca href=\"#/about\">About, credits and licences\u003c/a>\u003c/li>\u003c/ul>","headings":[{"level":2,"id":"elsewhere","text":"Elsewhere"}]},{"slug":"how-its-made","title":"How it's made","summary":"The whole pipeline, from OpenStreetMap and lidar to the drawing. What is measured, what is inferred, what is guessed.","file":"pages/how-its-made.md","html":"\u003ch1 id=\"p-how-its-made-how-its-made\">How it&#39;s made\u003c/h1>\n\u003cp>isoscape draws a real place as an isometric dot-and-line picture: inked edges, a dot on every\nvisible corner, flat fills. Nothing in it is drawn by hand. Every line comes from two open\ndatasets, OpenStreetMap and the USGS 3D Elevation Program, and the code decides where it\ngoes.\u003c/p>\n\u003cp>This page follows the pipeline from the download to the finished SVG. It also says, for every\npart of the picture, whether it was \u003cstrong>measured\u003c/strong>, \u003cstrong>inferred\u003c/strong> from a measurement, or\n\u003cstrong>guessed\u003c/strong>. They look the same on the page, and they are not.\u003c/p>\n\u003cp>Each build in the explorer also has its own \u003cstrong>How this view was made\u003c/strong> tab under the picture.\nIt gives that view&#39;s frame, sources and counts, and links back to the sections here.\u003c/p>\n\u003cp>\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMjI4IiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idCBkIiBmb250LWZhbWlseT0idWktc2Fucy1zZXJpZiwgLWFwcGxlLXN5c3RlbSwgJ1NlZ29lIFVJJywgc3lzdGVtLXVpLCBzYW5zLXNlcmlmIiB4bWxuczpjMnBhPSJodHRwOi8vYzJwYS5vcmcvbWFuaWZlc3QiPgo8dGl0bGUgaWQ9InQiPlRoZSBpc29zY2FwZSBwaXBlbGluZTwvdGl0bGU+CjxkZXNjIGlkPSJkIj5mZXRjaDogYSByZWdpb24gY29uZmlnIGRyaXZlcyBkb3dubG9hZHMgZnJvbSBPcGVuU3RyZWV0TWFwIGFuZCBVU0dTIDNERVAgaW50byBhIGxvY2FsIGNhY2hlLiBidWlsZDogdGhlIGNhY2hlIGlzIHBhcnNlZCwgcHJvamVjdGVkLCBnaXZlbiB0ZXJyYWluLCB0dXJuZWQgaW50byBhIHNjZW5lLCBzb3J0ZWQsIGRyYXduIGFzIFNWRywgYXJjaGl2ZWQsIGFuZCBsaXN0ZWQgaW4gdGhlIGV4cGxvcmVyLjwvZGVzYz4KPHN0eWxlPgouYntmaWxsOiNmYmZhZjc7c3Ryb2tlOiMyNjI1MmI7c3Ryb2tlLXdpZHRoOjEuMn0KLmt7ZmlsbDojZGNlYmYyO3N0cm9rZTojMmY2ZjhmO3N0cm9rZS13aWR0aDoxLjJ9Ci50e2ZpbGw6IzI2MjUyYjtmb250LXNpemU6MTNweDtmb250LXdlaWdodDo2MDB9Ci5ze2ZpbGw6Izc3NzM3YTtmb250LXNpemU6MTFweDtmb250LWZhbWlseTp1aS1tb25vc3BhY2UsU0ZNb25vLVJlZ3VsYXIsTWVubG8sbW9ub3NwYWNlfQoubHtmaWxsOiM3NzczN2E7Zm9udC1zaXplOjEycHg7Zm9udC1zdHlsZTppdGFsaWN9Ci5he2ZpbGw6bm9uZTtzdHJva2U6Izc3NzM3YTtzdHJva2Utd2lkdGg6MS4yO21hcmtlci1lbmQ6dXJsKCNoKX0KLmh7ZmlsbDojNzc3MzdhfQouZG90e2ZpbGw6IzI2MjUyYn0KQG1lZGlhIChwcmVmZXJzLWNvbG9yLXNjaGVtZTogZGFyayl7Ci5ie2ZpbGw6IzFiMWQyMztzdHJva2U6I2U1ZTZlY30ua3tmaWxsOiMyMjMyM2Q7c3Ryb2tlOiM3ZmI2ZDR9LnR7ZmlsbDojZTVlNmVjfS5zLC5se2ZpbGw6Izk0OTdhM30uYXtzdHJva2U6Izk0OTdhM30uaHtmaWxsOiM5NDk3YTN9LmRvdHtmaWxsOiNlNWU2ZWN9Cn0KPC9zdHlsZT4KPGRlZnM+PG1hcmtlciBpZD0iaCIgdmlld0JveD0iMCAwIDggOCIgcmVmWD0iNyIgcmVmWT0iNCIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBjbGFzcz0iaCIgZD0iTTAgMEw4IDRMMCA4eiIvPjwvbWFya2VyPjwvZGVmcz4KCjx0ZXh0IGNsYXNzPSJsIiB4PSIxMCIgeT0iMTQiPmZldGNoIOKAlCB0aGUgb25seSBzdGVwIHRoYXQgdG91Y2hlcyB0aGUgbmV0d29yazwvdGV4dD4KPHJlY3QgY2xhc3M9Im FBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQVBaWVFCY1B5clpoSEt6a3hkOFlpZmROQzBjZWs1YnFtZGRTTkVlc2svMzlTZjJvZEcxVm1HM1hHZUNYeU1EOTZzSEM4L2VOQStsQzJIOWtqVUZJZDVOOTJzQT08L2MycGE6bWFuaWZlc3Q+PC9tZXRhZGF0YT48L3N2Zz4K\" alt=\"The pipeline: fetch from OpenStreetMap and 3DEP into a local cache, then parse, camera, terrain, scene, order, draw, archive and explorer\" loading=\"lazy\">\u003c/p>\n\u003cp>Where to start:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lidar and GIS:\u003c/strong> \u003ca href=\"#/how-its-made/terrain\">Terrain\u003c/a>, \u003ca href=\"#/how-its-made/rivers\">Rivers\u003c/a>, \u003ca href=\"#/how-its-made/rapids\">Rapids\u003c/a> and\n\u003ca href=\"#/how-its-made/shoreline\">Shoreline\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Urban planning:\u003c/strong> \u003ca href=\"#/how-its-made/buildings\">Buildings\u003c/a>, \u003ca href=\"#/how-its-made/bridges\">Bridges\u003c/a> and\n\u003ca href=\"#/how-its-made/measured-inferred-guessed\">Measured, inferred, guessed\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Art and illustration:\u003c/strong> \u003ca href=\"#/how-its-made/camera\">Camera\u003c/a>, \u003ca href=\"#/how-its-made/drawing\">Drawing\u003c/a> and\n\u003ca href=\"#/how-its-made/paint-order\">Paint order\u003c/a>.\u003c/li>\u003cli>\u003cstrong>History:\u003c/strong> \u003ca href=\"#/how-its-made/time\">Time\u003c/a> covers the dated series: what is measured, what is curated, and\nwhat a series cannot show.\u003c/li>\u003cli>\u003cstrong>Development:\u003c/strong> every section names the file that does the work. The\n\u003ca href=\"#/how-its-made/archive-and-explorer\">archive and explorer\u003c/a> section covers the build loop.\u003c/li>\u003c/ul>\n\u003ch2 id=\"p-how-its-made-measured-inferred-guessed\">Measured, inferred, guessed\u003c/h2>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part of the picture\u003c/th>\u003cth>Comes from\u003c/th>\u003cth>How sure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Building footprints, roads, rail, parks, water outlines\u003c/td>\u003ctd>OpenStreetMap\u003c/td>\u003ctd>Mapped by volunteers, mostly traced from aerial imagery. Usually good, sometimes stale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Extra footprints (where a region asks)\u003c/td>\u003ctd>Microsoft&#39;s ML building footprints\u003c/td>\u003ctd>Traced by a model from imagery. Good outlines, sometimes merged or missing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Building heights\u003c/td>\u003ctd>OSM \u003ccode>height\u003c/code>, else Microsoft&#39;s model, else \u003ccode>building:levels\u003c/code>, else a guess\u003c/td>\u003ctd>Mixed. In downtown Richmond about 40% are guesses; around Gwynn&#39;s Island, a little over half. Each build reports its own split\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Woods, wetlands, fields, crops (where a region asks)\u003c/td>\u003ctd>USGS National Land Cover Database (NLCD 2021)\u003c/td>\u003ctd>Classified from satellite imagery at 30 m. Right in the large, coarse at the edges\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ground elevation\u003c/td>\u003ctd>USGS 3DEP bare-earth model\u003c/td>\u003ctd>Measured. 1 m lidar where it has been flown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>River surface\u003c/td>\u003ctd>The lowest lidar returns over mapped water, smoothed\u003c/td>\u003ctd>Inferred\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exposed rock and rapids\u003c/td>\u003ctd>Height above, and fall of, that surface\u003c/td>\u003ctd>Inferred\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shoreline (with terrain)\u003c/td>\u003ctd>Mapped water, corrected against the lidar\u003c/td>\u003ctd>Inferred\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bridge deck heights\u003c/td>\u003ctd>A per-region rule by name, else a default per OSM layer\u003c/td>\u003ctd>Rule of thumb\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Camera bearing\u003c/td>\u003ctd>Snapped to the street grid, or set in the region\u003c/td>\u003ctd>Chosen\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"p-how-its-made-inputs\">Inputs\u003c/h2>\n\u003cp>\u003cstrong>OpenStreetMap.\u003c/strong> \u003ccode>fetch\u003c/code> asks the Overpass API for everything the renderer can draw:\nbuildings and building parts, water and waterways, roads, railways, parks, woods and other\nland cover, islands, coastline and car parks. Large areas are fetched in tiles of at most\n1.6 km a side, because Overpass refuses or times out on big requests. Four public mirrors are\ntried in turn. Each tile is cached as it arrives, so an interrupted fetch picks up where it\nstopped. The merged answer is saved as \u003ccode>data/&lt;region&gt;/osm.json\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Elevation.\u003c/strong> The ground comes from the \u003ca href=\"https://www.usgs.gov/3d-elevation-program\" target=\"_blank\" rel=\"noopener\">USGS 3D Elevation Program\n(3DEP)\u003c/a>. Its seamless bare-earth model is served by\nthe National Map&#39;s \u003ccode>exportImage\u003c/code> service, which returns the best data available for each\nplace: 1 m lidar where it has been flown, coarser models elsewhere. Bare earth means\nbuildings and trees have been removed. isoscape requests uncompressed 32-bit float GeoTIFFs\nin tiles of at most 1,500 pixels a side, at 1 m per pixel unless the region sets\n\u003ccode>demResolution\u003c/code>. The tiles are stitched together and stored as \u003ccode>data/&lt;region&gt;/dem.bin.gz\u003c/code>:\ngzipped 16-bit integers in centimetres, so heights are kept to the nearest centimetre.\u003c/p>\n\u003cp>3DEP sometimes fills a gap in its coverage with a large negative number. One patch near\nShockoe Bottom reads −88 m. Any sample below −5 m is treated as missing, along with a\nthree-pixel rim around it, and filled from its neighbours.\u003c/p>\n\u003cp>The download covers the frame&#39;s circumscribed circle plus a 60 m margin. The camera can turn\nafter the data arrives (see \u003ca href=\"#/how-its-made/camera\">Camera\u003c/a>), and the data still covers the frame. \u003cstrong>Builds\nnever touch the network\u003c/strong>, so a build can be repeated exactly.\u003c/p>\n\u003cp>\u003cstrong>Building footprints, beyond OSM.\u003c/strong> OSM is thorough in cities and thin in the country.\nAround Gwynn&#39;s Island it maps 417 buildings, while Microsoft&#39;s\n\u003ca href=\"https://github.com/microsoft/GlobalMLBuildingFootprints\" target=\"_blank\" rel=\"noopener\">Global ML Building Footprints\u003c/a>\nfind over 6,000. A region can list \u003ccode>&quot;microsoft&quot;\u003c/code> in \u003ccode>sources.buildings\u003c/code>. \u003ccode>fetch\u003c/code> then\ndownloads the dataset&#39;s parts for the region&#39;s zoom-9 quadkeys, keeps the footprints whose\ncentres fall in the region, and stores them in \u003ccode>data/&lt;region&gt;/footprints.json\u003c/code>. The model\nestimates a height for many of them, and that height is kept.\u003c/p>\n\u003cp>\u003cstrong>Land cover.\u003c/strong> Rural OSM rarely maps woods and fields. A region with \u003ccode>sources.landcover: &quot;nlcd&quot;\u003c/code> gets the \u003ca href=\"https://www.mrlc.gov/\" target=\"_blank\" rel=\"noopener\">National Land Cover Database\u003c/a> (NLCD 2021) through\nthe MRLC&#39;s map service. That&#39;s a 30 m classification of the whole country: forest, wetland,\npasture, crops, scrub and so on. The map image comes back with each class in its legend\ncolour, and each colour is matched back to its class. The result is stored in\n\u003ccode>data/&lt;region&gt;/landcover.bin.gz\u003c/code>.\u003c/p>\n\u003cp>Code: \u003ccode>src/osm.ts\u003c/code>, \u003ccode>src/dem.ts\u003c/code>, \u003ccode>src/footprints.ts\u003c/code>, \u003ccode>src/landcover.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-region\">Region\u003c/h2>\n\u003cp>A place is one JSON file in \u003ccode>regions/\u003c/code>. It sets the centre (longitude, latitude), the frame&#39;s\nwidth and depth in metres, the camera&#39;s bearing and whether it may snap, the scale in pixels\nper metre, the tilt, the terrain settings, rules for bridge decks, and the palette. The\nREADME&#39;s &quot;Region config&quot; section lists every key.\u003c/p>\n\u003cp>Positions are converted to local metres east and north of the centre. This simple\nequirectangular approximation is accurate to a fraction of a metre across a city-sized frame.\u003c/p>\n\u003cp>Code: \u003ccode>src/region.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-camera\">Camera\u003c/h2>\n\u003cp>The camera is \u003cstrong>orthographic\u003c/strong>: no perspective, so a building is the same size near and far,\nand lengths across the picture can be measured with a ruler. It looks down at a fixed tilt.\nThe region sets \u003ccode>squash\u003c/code>, the sine of that tilt:\u003c/p>\n\u003cul>\u003cli>Ground across the picture is drawn at full scale (\u003ccode>scale\u003c/code> pixels per metre).\u003c/li>\u003cli>Ground running into the picture is drawn at \u003ccode>squash\u003c/code> of its length. At 0.5 the tilt is 30°,\nthe classic 2:1 view of isometric games.\u003c/li>\u003cli>Heights are drawn at the cosine of the tilt (0.87 at 30°), times any \u003ccode>exaggeration\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>The frame is a rectangle on the ground, square to the camera, so it lands on the screen as a\nplain rectangle. That suits a panorama.\u003c/p>\n\u003cp>\u003cstrong>Snap.\u003c/strong> Seen from due north, most street grids sit at an awkward angle. With \u003ccode>snap\u003c/code> on,\nisoscape measures the dominant direction of every building edge in the frame (weighted by\nlength, folded so that edges at 0°, 90°, 180° and 270° all count for the same grid). The camera\nthen turns by up to 45° to put that grid on the picture&#39;s diagonals. Downtown Richmond snaps to\na bearing of −8.7°. Set \u003ccode>&quot;snap&quot;: false\u003c/code> to keep the bearing you gave.\u003c/p>\n\u003cp>Code: \u003ccode>src/view.ts\u003c/code>, \u003ccode>chooseBearing\u003c/code> in \u003ccode>src/scene.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-ground\">Ground\u003c/h2>\n\u003cp>Each OSM area is classified by its tags as water, island, park or grass, wood, marsh, sand,\nbare rock, parking or cemetery, and drawn as a flat fill in that order. Rivers are drawn from\ntheir mapped area, never from their centre line. Canals, streams and ditches are drawn as\nribbons of a typical width.\u003c/p>\n\u003cp>\u003cstrong>Roads and rail\u003c/strong> become ribbons. A road&#39;s width comes from its \u003ccode>width\u003c/code> tag if it has one,\notherwise from its class: 14 m for a motorway, 7 m for a residential street, 1.8 m for a\nfootway. Tunnels are left out. Railways are 3.2 m ribbons with dashed ties. Weirs and dams\nare drawn as white crests.\u003c/p>\n\u003cp>\u003cstrong>Land cover from NLCD\u003c/strong>, where a region uses it, goes down first, between the bare ground\nand OSM&#39;s own areas. Each 30 m class is resampled onto the terrain grid and grouped as woods,\nevergreen woods, swamp, marsh, field, crop, scrub or barren. Each group&#39;s edge is traced\nsmoothly through the grid, the same way as the shoreline, so the blocks don&#39;t show as\nsquares. OSM&#39;s parks, woods and marshes are drawn on top of it, so mapped detail wins.\u003c/p>\n\u003cp>Code: \u003ccode>src/classify.ts\u003c/code>, \u003ccode>buildScene\u003c/code> in \u003ccode>src/scene.ts\u003c/code>, cover in \u003ccode>paintStrip\u003c/code> in \u003ccode>src/render.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-coastline\">Coastline\u003c/h2>\n\u003cp>OSM does not map the sea, or tidal water like the Chesapeake Bay, as water polygons. It maps\nthe coastline as lines with the land always on their left. isoscape joins those lines into\nchains and cuts them where they cross the frame. It closes each piece of land by walking the\nframe&#39;s edge, and the water is the frame minus the land. The result can be wrong if the\ncoastline near the frame is broken or mis-tagged.\u003c/p>\n\u003cp>Code: \u003ccode>src/coast.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-terrain\">Terrain\u003c/h2>\n\u003cp>With terrain turned on, the elevation is resampled onto a regular grid in the camera&#39;s\ncoordinates, every 5 m by default (\u003ccode>cell\u003c/code>). A light blur removes the curbs, rubble and noise\nthat 1 m lidar records and a 5 m grid would turn into speckle.\u003c/p>\n\u003cp>The scene&#39;s height at any point is its elevation above the lowest point in the frame (the\n\u003cstrong>datum\u003c/strong>), times \u003ccode>terrain.exaggeration\u003c/code>. The sample regions draw hills 2.5–4× taller than\nlife, so the landform reads from a distance. \u003cstrong>Buildings and bridges keep their true heights\u003c/strong> on top\nof the exaggerated ground, so a 2.5× hill does not stretch the towers standing on it.\u003c/p>\n\u003cp>Shading and contours are computed from the true elevation, not the exaggerated one:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Hillshade.\u003c/strong> Each cell is lit from the left and a little towards the camera. The result is\nrounded to one of 12 steps lighter or darker, which keeps the SVG small. Very steep ground\ncan look stepped.\u003c/li>\u003cli>\u003cstrong>Contours.\u003c/strong> Marching squares every 2 m by default (\u003ccode>contour\u003c/code>), with every fifth line\nheavier (\u003ccode>majorEvery\u003c/code>). There are no contours over water.\u003c/li>\u003c/ul>\n\u003cp>Code: \u003ccode>src/terrain.ts\u003c/code>, \u003ccode>paintStrip\u003c/code> in \u003ccode>src/render.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-rivers\">Rivers\u003c/h2>\n\u003cp>Lidar over a river is not the river. 3DEP&#39;s bare-earth surfaces are mostly hydro-flattened,\nlevel across the water and stepping down along it. But OSM&#39;s water outline never matches\nthem to the metre, and rocks, ledges and overlapped banks stand above the water. Draped\nnaively, the river would climb its own banks.\u003c/p>\n\u003cp>So the river&#39;s surface is \u003cstrong>recovered\u003c/strong>. At each water point on the grid, it is taken as a\nlow value (the 15th percentile) of the elevations of all water points within 30 m. It is then\nsmoothed along the water. The river ends up level across its width and falling along its\ncourse, steeply only where it really drops.\u003c/p>\n\u003cul>\u003cli>Water points standing \u003cstrong>more than 1 m above that surface\u003c/strong>, at least two grid cells (10 m\nat the default 5 m grid) from shore, are drawn as \u003cstrong>exposed rock\u003c/strong>. These are the boulder fields of the falls.\u003c/li>\u003cli>Near the shore, mapped &quot;water&quot; standing more than 1 m above the surface is treated as bank.\nIt is \u003cstrong>given back to the land\u003c/strong> at its own height.\u003c/li>\u003c/ul>\n\u003cp>Both are inferences: a gravel bar mapped as water or a misplaced outline can produce false\nrock. Flat regions skip all of this and draw OSM&#39;s outlines as they are.\u003c/p>\n\u003cp>Code: \u003ccode>settleWater\u003c/code> in \u003ccode>src/terrain.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-rapids\">Rapids\u003c/h2>\n\u003cp>A rapid is where the recovered water surface \u003cstrong>falls quickly\u003c/strong>. At each water point at least\ntwo grid cells from shore, the fall is measured across 40 m in four directions, and the steepest is\nkept. Measuring over 40 m means a single noisy cell cannot fake a rapid. Where the fall\nexceeds \u003ccode>terrain.rapids\u003c/code> (0.035 by default, 3.5 m per 100 m), the cell reads as a rapid.\u003c/p>\n\u003cp>Each rapid cell gets one or two short white strokes across the current, plus a wash of froth\nwhere it drops hardest. The strokes are placed by a hash of the cell&#39;s position, not at\nrandom, so the same data always draws the same marks. Weirs mapped in OSM are drawn\nseparately.\u003c/p>\n\u003cp>Rapids are \u003cstrong>inferred, not observed\u003c/strong>. They show where the lidar surface is steep, which is\nusually where the water is white, but river level on the day of the survey, a misplaced\noutline or a dam can all mislead it. The build&#39;s tab reports how many cells were read as\nrapids.\u003c/p>\n\u003cp>Code: \u003ccode>riverFall\u003c/code> in \u003ccode>src/terrain.ts\u003c/code>, \u003ccode>paintStrip\u003c/code> in \u003ccode>src/render.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-shoreline\">Shoreline\u003c/h2>\n\u003cp>With terrain, the water&#39;s edge is traced from the lidar-corrected water grid (marching squares\nover a lightly smoothed mask), not from OSM&#39;s outline, and drawn at the river&#39;s surface. Where\nthe outline overlaps a steep bank, the bank slopes into the water instead of the water\nclimbing the bank.\u003c/p>\n\u003cp>Code: \u003ccode>paintStrip\u003c/code> in \u003ccode>src/render.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-buildings\">Buildings\u003c/h2>\n\u003cp>Every OSM building that lies \u003cstrong>wholly inside the frame\u003c/strong> and covers at least\n\u003ccode>minBuildingArea\u003c/code> (12 m² by default) becomes a prism. Walls are drawn on the sides facing the\ncamera, and the roof goes on top. Courtyards work. Wall shading follows which way each wall\nfaces, with the light from the left. Roof colour follows the building&#39;s type: homes,\ncommerce, industry or civic. Where a building is mapped as Simple 3D Buildings parts\n(\u003ccode>building:part\u003c/code>), the parts are drawn instead of the outline. Open canopies\n(\u003ccode>building=roof\u003c/code>) are left out.\u003c/p>\n\u003cp>\u003cstrong>Footprints from Microsoft&#39;s model\u003c/strong> fill in where OSM has none. Wherever an OSM building\nand a footprint overlap, OSM wins and the footprint is dropped. A footprint is dropped if its\ncentre lies in an OSM building, or if it holds an OSM building&#39;s centre.\u003c/p>\n\u003cp>\u003cstrong>Heights\u003c/strong> are taken from the first of these that the building has:\u003c/p>\n\u003col>\u003cli>a \u003ccode>height\u003c/code> tag, from a survey or a mapper&#39;s estimate;\u003c/li>\u003cli>\u003cstrong>an estimate from Microsoft&#39;s model\u003c/strong>, for its own footprints, where it made one;\u003c/li>\u003cli>\u003ccode>building:levels\u003c/code>, at 3.4 m a floor, plus half a floor for each roof level;\u003c/li>\u003cli>\u003cstrong>a guess\u003c/strong> from the building&#39;s type and size: 3.2 m for a shed or anything under 40 m²,\n8 m for a house, 10 m for a terrace, 16 m for apartments or a hotel, 13 m for an office\n(24 m over 1,500 m²), 11 m for industry, 16 m for a church, and 8–14 m by footprint for\nanything else.\u003c/li>\u003c/ol>\n\u003cp>Each build counts how many heights came from each source. A view with many guesses has the\nright footprints and plausible but invented skylines. Joining real heights from lidar (the\nfirst-return surface minus bare earth) is the top item on the roadmap.\u003c/p>\n\u003cp>On a slope, a building stands on the \u003cstrong>lowest\u003c/strong> ground under it, so its downhill wall shows\nits full height. The roof sits at the building&#39;s height above the average ground under it.\u003c/p>\n\u003cp>Code: \u003ccode>buildingHeights\u003c/code> in \u003ccode>src/classify.ts\u003c/code>, \u003ccode>extrude\u003c/code> in \u003ccode>src/scene.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-bridges\">Bridges\u003c/h2>\n\u003cp>OSM splits one bridge into many ways, at every change of lanes, name or junction. Ramping\neach piece down to the ground would turn a viaduct into a roller coaster. So bridge ways that\nshare an end, a layer and a kind (road or rail) are joined into chains first. A chain only\nramps down at an end that touches no other bridge.\u003c/p>\n\u003cp>\u003cstrong>Deck height is a rule of thumb.\u003c/strong> OSM rarely records it. A region can name a height for a\nbridge, for example \u003ccode>{ &quot;match&quot;: &quot;Manchester&quot;, &quot;deck&quot;: 24 }\u003c/code>. Otherwise the deck sits\n\u003ccode>bridgeDeck\u003c/code> metres (7 by default) above the ground for each OSM \u003ccode>layer\u003c/code>. The deck is a taut\nline over whatever it crosses: never closer to the ground than its clearance, rising in\nstraight runs, and easing down over at most 70 m at a free end. Piers drop to the real ground\nor water every 38 m where the deck is more than 3 m up.\u003c/p>\n\u003cp>Each bridge is cut into spans of at most 22 m, so a long bridge can pass in front of one\nbuilding and behind another. Bridges are cut at the edges of the frame.\u003c/p>\n\u003cp>Code: \u003ccode>chainBridges\u003c/code> and \u003ccode>bridgePieces\u003c/code> in \u003ccode>src/scene.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-paint-order\">Paint order\u003c/h2>\n\u003cp>The drawing has no depth buffer. Things are painted back to front, and the order is the hard\npart. Sorting by a single depth per object fails as soon as a long warehouse sits beside a\nsmall house. So the order is decided \u003cstrong>pairwise\u003c/strong>, only between objects whose boxes overlap\non screen:\u003c/p>\n\u003cul>\u003cli>If their footprints can be separated by a line, the one on the camera&#39;s side of that line\nis in front.\u003c/li>\u003cli>If the footprints overlap (stacked building parts), the one entirely above is in front.\u003c/li>\u003cli>Otherwise the nearer centre wins.\u003c/li>\u003c/ul>\n\u003cp>A topological sort turns these pairwise results into one order. The rare cycle, from concave\nfootprints that interlock, is broken by depth.\u003c/p>\n\u003cp>Code: \u003ccode>src/order.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-drawing\">Drawing\u003c/h2>\n\u003cp>\u003cstrong>The ground is painted in strips\u003c/strong>, two grid rows deep (10 m at the default cell size), from\nthe back of the frame to the front. A landscape hides parts of itself: a bank that falls away\nfrom the camera hides the water behind it. Each strip drapes everything that lies on it over\nthe terrain: bare ground, parks, water, roads, rail, hillshade, contours, rocks and rapids.\nEach building or bridge is painted straight after the strip that holds its front edge, so a\nhill in front of it covers it and the ground behind it does not.\u003c/p>\n\u003cp>The front of the plate is a \u003cstrong>slab\u003c/strong>, a true cross-section of the ground along the near edge,\nwith water where the cut crosses the river.\u003c/p>\n\u003cp>\u003cstrong>The SVG is compact.\u003c/strong> Coordinates are rounded to a tenth of a pixel and written relative to\nthe previous point. Draped edges are simplified to a quarter pixel. Each dot is a zero-length\nline with round caps. Even so, a big region can produce a 25 MB file. The \u003ccode>--png\u003c/code> option\nrenders a raster with \u003ccode>rsvg-convert\u003c/code>. Colours and line weights come from a palette (\u003ccode>paper\u003c/code>\nor \u003ccode>night\u003c/code>).\u003c/p>\n\u003cp>Code: \u003ccode>src/render.ts\u003c/code>, \u003ccode>src/palette.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-time\">Time\u003c/h2>\n\u003cp>A region with a \u003ccode>time\u003c/code> section is drawn as a \u003cstrong>series\u003c/strong>: one scene for each year (epoch) in its\nhistory file, built with \u003ccode>isoscape series &lt;region&gt;\u003c/code>. The downtown Richmond series runs from\nthe 1737 town plan to today. Each scene combines two kinds of evidence, and the explorer says\nwhich is which.\u003c/p>\n\u003cp>\u003cstrong>Measured: buildings standing today, by the year each was built.\u003c/strong> A building appears in\nevery scene from its year on. The year comes from:\u003c/p>\n\u003col>\u003cli>a curated year, for a few landmarks whose records are known to be wrong or missing (the\nCapitol, St. John&#39;s Church, the Old Stone House and so on), each with a source;\u003c/li>\u003cli>else OpenStreetMap&#39;s \u003ccode>start_date\u003c/code> tag;\u003c/li>\u003cli>else the city assessor&#39;s \u003cem>year built\u003c/em> for the parcel under the building&#39;s centre.\u003c/li>\u003c/ol>\n\u003cp>The assessor records one year per parcel, the year of its main building. Up to four buildings\non a lot (a row split in OSM, a house and its shed) all take that year. With more buildings,\nonly one clearly larger than the rest takes it. A parcel with eight or more (a campus, Capitol\nSquare) gives its year to none of them. Buildings with no year appear only in today&#39;s scene.\u003c/p>\n\u003cp>\u003cstrong>Curated: what is gone or was different.\u003c/strong> A short list per series, each item with its\nyears and sources: a filled canal basin, a burned district, a buried creek, demolished\nlandmarks drawn from published dimensions in a red-brown tone (a burned shell in ash grey), and\nthe town plan, which limits the earliest scene&#39;s streets to the original grid. Positions come\nfrom today&#39;s street grid. They are not surveyed.\u003c/p>\n\u003cp>\u003cstrong>Traced: buildings from fire-insurance maps.\u003c/strong> The Sanborn Map Company drew every building\nin a city&#39;s business district for insurers, block by block. Each building appears as a\nfootprint coloured by material: pink brick, yellow frame, blue stone, grey iron. The Library of\nCongress has Richmond editions from 1886 to 1925 online. isoscape traces them:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Georeference.\u003c/strong> Each sheet is placed on the ground by a rotation and shift: at one scale\nper edition, two or three named street corners read off the sheet are enough. A third\ncorner checks the first two. The block outlines from the city&#39;s GIS are drawn over each\nsheet to confirm the fit (\u003ccode>tools/sanborn/rigid.py\u003c/code>, \u003ccode>ovmosaic.py\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Trace.\u003c/strong> The coloured fills are separated from the paper and the printed lines, read for\nmaterial, closed over the lettering, and traced as polygons. Near-rectangles are squared\nup, and outlines and thin strips (river banks, rails) are dropped (\u003ccode>extract.py\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Follow through time.\u003c/strong> A traced footprint mostly covered by a building standing today is\ntaken to be that building, or its replacement on the same footprint, and today&#39;s data\nalready draws it. The rest are \u003cstrong>lost buildings\u003c/strong>. Each is drawn from the first edition\nthat shows it, though it may be older. It is drawn until it is known to be gone, in this\norder of preference: a later edition that maps the spot without it; the year the building\non its site today went up; the opening of an expressway through it. Failing all of those,\nit is \u003cem>assumed\u003c/em> gone by 1960, when clearing for parking and highways began\n(\u003ccode>lifespans.py\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Clean.\u003c/strong> A last pass drops slivers, any footprint more than 8 times longer than it is\nwide and under 12 m wide, or over 100 m long and under 8 m wide on average: on the sheets these are rail viaducts, track-side sheds and street\nedges, and extruded they would stand as walls. It then smooths each outline to within 1.5 m,\nso pixel stair-steps do not draw as striped walls. It also drops sprawls (over 2,000 m² and\nfilling under 45% of their convex hull: river shading, not buildings) and merges footprints\ntraced in two editions that overlap by more than 85%, keeping the earlier start and the later\nend (\u003ccode>clean.py\u003c/code>: 68 dropped, 170 merged).\u003c/li>\u003c/ol>\n\u003cp>The historic buildings are sketches, not a survey. A machine traced them from scans of\nfire-insurance maps, so outlines are approximate, heights are guessed from material, and some\nbuildings are missing, misplaced or merged. The 1924 overview (&quot;congested district&quot;) sheet is\nthe least precise source. The historic scenes show the city&#39;s shape and density, not each\nbuilding exactly.\u003c/p>\n\u003cp>Traced buildings keep the maps&#39; colours, so they read apart from today&#39;s. Their heights are\nguessed from their material (brick and stone three storeys, frame two): the storey counts\nprinted on the sheets are not read yet; later editions add olive-brown for fire-proof\nconstruction, drawn six storeys. The explorer counts, for each scene, how many traced\nbuildings stand and how each one&#39;s end date was found.\u003c/p>\n\u003cp>Five editions are traced: \u003cstrong>1886\u003c/strong>; \u003cstrong>1895\u003c/strong> and \u003cstrong>1905\u003c/strong> (sheets read by eye); \u003cstrong>1924–25\u003c/strong>, whose first volume opens with a single\n&quot;congested district&quot; map of the whole business district (fitted with a rubber sheet\nthrough sixteen street corners, each snapped to the city&#39;s block outlines); and\n\u003cstrong>1950–52\u003c/strong>, a corrected reprint whose sheets were matched feature by feature to their\n1924–25 versions where those were fitted, and read by eye otherwise. Each later edition turns\n&quot;assumed&quot; end dates into ones read from a map.\u003c/p>\n\u003cp>\u003cstrong>Era rules\u003c/strong> date everything else that OSM maps: the first rule matching a feature&#39;s name,\n\u003ccode>ref\u003c/code> or tags decides the spans in which it existed. Interstates appear from 1958, the\nDowntown Expressway from 1976, the river viaducts from 1901. The James River and Kanawha Canal\nappears from 1800 until the railroad took it over, and again from the Canal Walk of 1999.\nFeatures no rule matches are drawn in every year, which suits the street grid. Paths and other\nundated features are drawn only today.\u003c/p>\n\u003cp>In every scene after the first, buildings \u003cstrong>new since the previous scene\u003c/strong> have gold roofs.\u003c/p>\n\u003cp>\u003cstrong>What the series cannot show:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Survivorship.\u003c/strong> Only buildings standing today are measured. Downtown Richmond in 1900 had\nfar more buildings than the 1900 scene, because most of them were torn down later. The\nscenes show what survives, plus the few curated losses.\u003c/li>\u003cli>\u003cstrong>Heaped years.\u003c/strong> Assessors often round: in this data, many buildings are dated to exactly\n1900 or 1910. Read the decades loosely.\u003c/li>\u003cli>\u003cstrong>Today&#39;s ground.\u003c/strong> The elevation is today&#39;s lidar, so the I-95 cut through Shockoe Valley\nis there in 1737. Curated water is laid flat at the lowest ground beneath it.\u003c/li>\u003cli>\u003cstrong>The jump to today.\u003c/strong> Undated buildings appear only in today&#39;s scene, so the last step of a\nseries adds many more buildings than really went up in that interval.\u003c/li>\u003c/ul>\n\u003cp>Code: \u003ccode>src/history.ts\u003c/code>; the history file is \u003ccode>history/&lt;series&gt;.json\u003c/code>; the tracing tools are in\n\u003ccode>tools/sanborn/\u003c/code> (Python: NumPy, SciPy, OpenCV, Shapely), and their output is\n\u003ccode>history/sanborn/\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-archive-and-explorer\">Archive and explorer\u003c/h2>\n\u003cp>Every build is kept under \u003ccode>out/builds/&lt;timestamp&gt;-&lt;name&gt;/\u003c/code> as the SVG, a thumbnail and a\n\u003ccode>meta.json\u003c/code>. The meta file records:\u003c/p>\n\u003cul>\u003cli>the region&#39;s settings;\u003c/li>\u003cli>the camera bearing used;\u003c/li>\u003cli>every count the build measured (features, ground areas, buildings by height source, bridge\nspans, rapid cells, contour segments, strips);\u003c/li>\u003cli>the build&#39;s time and file size;\u003c/li>\u003cli>the git commit, its subject, and whether \u003ccode>src/\u003c/code> or \u003ccode>regions/\u003c/code> had uncommitted changes;\u003c/li>\u003cli>an optional \u003ccode>--note\u003c/code> saying what the build was trying;\u003c/li>\u003cli>for a dated scene, its year, the year before it in the series, and the curated features\ndrawn in it, with their sources.\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>backfill\u003c/code> builds an older commit&#39;s code against today&#39;s cached data, so the archive can\ninclude outputs from before it existed.\u003c/p>\n\u003cp>After every build, \u003ccode>out/index.html\u003c/code> is rewritten: this explorer. It is a single file with the\nbuild list and these pages embedded in it, so it opens from disk with no server. The pages are\nMarkdown files in \u003ccode>pages/\u003c/code>. To add one, see the README.\u003c/p>\n\u003cp>Code: \u003ccode>src/archive.ts\u003c/code>, \u003ccode>src/explorer.ts\u003c/code>, \u003ccode>src/pages.ts\u003c/code>.\u003c/p>\n\u003ch2 id=\"p-how-its-made-credits\">Credits\u003c/h2>\n\u003cp>Map data © \u003ca href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OpenStreetMap\u003c/a> contributors, available\nunder the Open Database License. Elevation from the \u003ca href=\"https://www.usgs.gov/3d-elevation-program\" target=\"_blank\" rel=\"noopener\">USGS 3D Elevation\nProgram\u003c/a>, public domain. Years built for the\nRichmond series from the City of Richmond&#39;s open data. Fire-insurance maps from the Library\nof Congress Sanborn Maps Collection. See \u003ca href=\"#/about\">About\u003c/a> for what that means when you use\nor share a picture.\u003c/p>\n\u003cp>Inspired by \u003ca href=\"https://isometricsf.com\" target=\"_blank\" rel=\"noopener\">Isometric SF\u003c/a>, Justin Chavez&#39;s isometric pixel-art map\nof San Francisco (\u003ca href=\"https://www.justinchavez.com/blog/isometric-sf-how/\" target=\"_blank\" rel=\"noopener\">how it was made\u003c/a>).\u003c/p>","headings":[{"level":2,"id":"measured-inferred-guessed","text":"Measured, inferred, guessed"},{"level":2,"id":"inputs","text":"Inputs"},{"level":2,"id":"region","text":"Region"},{"level":2,"id":"camera","text":"Camera"},{"level":2,"id":"ground","text":"Ground"},{"level":2,"id":"coastline","text":"Coastline"},{"level":2,"id":"terrain","text":"Terrain"},{"level":2,"id":"rivers","text":"Rivers"},{"level":2,"id":"rapids","text":"Rapids"},{"level":2,"id":"shoreline","text":"Shoreline"},{"level":2,"id":"buildings","text":"Buildings"},{"level":2,"id":"bridges","text":"Bridges"},{"level":2,"id":"paint-order","text":"Paint order"},{"level":2,"id":"drawing","text":"Drawing"},{"level":2,"id":"time","text":"Time"},{"level":2,"id":"archive-and-explorer","text":"Archive and explorer"},{"level":2,"id":"credits","text":"Credits"}]},{"slug":"about","title":"About, credits and licences","summary":"What isoscape is, whose data it draws, and what to credit when you share a picture.","file":"pages/about.md","html":"\u003ch1 id=\"p-about-about-credits-and-licences\">About, credits and licences\u003c/h1>\n\u003cp>isoscape makes isometric dot-and-line views of real places from open map data. It is a\nsibling of \u003ca href=\"https://github.com/busse/dotscene\" target=\"_blank\" rel=\"noopener\">dotscene\u003c/a>. The two share a visual language,\nbut dotscene is for drawing a scene by hand, and isoscape \u003cem>surveys\u003c/em> one: you choose a frame on\nthe world, and the data decides the rest. \u003ca href=\"#/how-its-made\">How it&#39;s made\u003c/a> explains each step.\u003c/p>\n\u003ch2 id=\"p-about-how-it-was-made\">How it was made\u003c/h2>\n\u003cp>isoscape was built, and the holiday shop is run, in chats with Claude, Anthropic&#39;s AI, using\nClaude Opus 5.5, directed and reviewed by Chris Busse. Claude wrote the code, traced the\nhistoric buildings, laid out the prints, and set up the shop. The maps are drawn by software\nfrom open data, not by hand. The historic years are machine-traced sketches.\u003c/p>\n\u003ch2 id=\"p-about-try-it-yourself\">Try it yourself\u003c/h2>\n\u003cp>Open a chat with Claude (we used Claude Opus 5.5) and say:\u003c/p>\n\u003cblockquote>\u003cp>Use the GitHub repo busse/isoscape to make an isometric map of \u003cem>your place\u003c/em>.\u003c/p>\u003c/blockquote>\n\u003cp>It takes a few minutes. It works best for places in the US, where USGS elevation data gives\nthe terrain; elsewhere the map is flat.\u003c/p>\n\u003ch2 id=\"p-about-contact\">Contact\u003c/h2>\n\u003cp>isoscape is by Chris Busse.\u003c/p>\n\u003cul>\u003cli>Website: \u003ca href=\"https://fullbacklog.com\" target=\"_blank\" rel=\"noopener\">fullbacklog.com\u003c/a> (Substack)\u003c/li>\u003cli>LinkedIn: \u003ca href=\"https://linkedin.com/in/chrisbusse\" target=\"_blank\" rel=\"noopener\">linkedin.com/in/chrisbusse\u003c/a>\u003c/li>\u003cli>Threads: \u003ca href=\"https://www.threads.net/@busse\" target=\"_blank\" rel=\"noopener\">@busse\u003c/a>\u003c/li>\u003cli>Instagram: \u003ca href=\"https://www.instagram.com/busse\" target=\"_blank\" rel=\"noopener\">@busse\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2 id=\"p-about-inspiration\">Inspiration\u003c/h2>\n\u003cp>isoscape began as an attempt to draw Richmond the way \u003ca href=\"https://isometricsf.com\" target=\"_blank\" rel=\"noopener\">Isometric SF\u003c/a>\ndraws San Francisco: Justin Chavez&#39;s isometric pixel-art map of the city. His write-up,\n\u003ca href=\"https://www.justinchavez.com/blog/isometric-sf-how/\" target=\"_blank\" rel=\"noopener\">how it was made\u003c/a>, set out the idea\nthis project follows: an isometric city view drawn from open map data. isoscape&#39;s code and\ndrawing style are its own, but the idea came from his work.\u003c/p>\n\u003ch2 id=\"p-about-data\">Data\u003c/h2>\n\u003cp>\u003cstrong>OpenStreetMap.\u003c/strong> Map data © \u003ca href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OpenStreetMap\u003c/a>\ncontributors, available under the \u003ca href=\"https://opendatacommons.org/licenses/odbl/\" target=\"_blank\" rel=\"noopener\">Open Database License\n(ODbL)\u003c/a>. The cached \u003ccode>data/*/osm.json\u003c/code> files are\nOSM data and carry that licence. A rendered picture is a \u003cem>produced work\u003c/em>. You may use it, but\nit must credit OpenStreetMap wherever it is shown. Every SVG isoscape writes carries the\ncredit in its description, and every page shows it.\u003c/p>\n\u003cp>\u003cstrong>Historic scenes are sketches.\u003c/strong> Their lost buildings are traced by machine from Sanborn\nfire-insurance maps, so outlines and heights are approximate. They show the city&#39;s shape, not\na building-by-building survey.\u003c/p>\n\u003cp>\u003cstrong>Elevation.\u003c/strong> From the \u003ca href=\"https://www.usgs.gov/3d-elevation-program\" target=\"_blank\" rel=\"noopener\">USGS 3D Elevation Program\n(3DEP)\u003c/a>, served by the National Map. It is in the\npublic domain. The USGS asks for, but does not require, a credit. \u003ccode>data/*/dem.bin.gz\u003c/code> is a\nresampled copy.\u003c/p>\n\u003cp>\u003cstrong>Building footprints (some regions).\u003c/strong> \u003ca href=\"https://github.com/microsoft/GlobalMLBuildingFootprints\" target=\"_blank\" rel=\"noopener\">Microsoft Global ML Building\nFootprints\u003c/a>, under the ODbL like OSM.\nA view that uses them should credit Microsoft as well.\u003c/p>\n\u003cp>\u003cstrong>Land cover (some regions).\u003c/strong> The \u003ca href=\"https://www.mrlc.gov/\" target=\"_blank\" rel=\"noopener\">National Land Cover Database\u003c/a>\n(NLCD 2021) from the USGS and the Multi-Resolution Land Characteristics Consortium. It is in\nthe public domain.\u003c/p>\n\u003cp>\u003cstrong>Fire-insurance maps (dated series).\u003c/strong> Sanborn Fire Insurance Maps of Richmond, as digitised\nby the \u003ca href=\"https://www.loc.gov/collections/sanborn-maps/\" target=\"_blank\" rel=\"noopener\">Library of Congress\u003c/a>. The editions used\nwere published long enough ago to be out of US copyright. Check each item&#39;s rights statement\non the Library&#39;s site before reusing the scans. The traced footprints in \u003ccode>history/sanborn/\u003c/code>\nare derived from them.\u003c/p>\n\u003cp>\u003cstrong>Years built (dated series).\u003c/strong> The Richmond series uses the City of Richmond&#39;s \u003cem>Year of\nConstruction\u003c/em> layer, published on the city&#39;s ArcGIS open data service. Check the city&#39;s terms\nbefore redistributing \u003ccode>data/*/yearbuilt.json\u003c/code>. The curated history in \u003ccode>history/\u003c/code> cites its\nsources item by item.\u003c/p>\n\u003ch2 id=\"p-about-sharing-a-picture\">Sharing a picture\u003c/h2>\n\u003cp>Put this line with the picture. Drop the second part for a view drawn without terrain:\u003c/p>\n\u003cblockquote>\u003cp>Map data © OpenStreetMap contributors (ODbL) · Elevation: USGS 3DEP\u003c/p>\u003c/blockquote>\n\u003cp>and, where a region draws on them, add: · Building footprints: Microsoft (ODbL) · Land cover: NLCD 2021\u003c/p>\n\u003cp>Say what is estimated as well as what is measured. Many building heights are guesses, deck\nheights are rules of thumb, and rapids are inferred from the lidar (see\n\u003ca href=\"#/how-its-made/measured-inferred-guessed\">Measured, inferred, guessed\u003c/a>). A view used in\nplanning or teaching should not be read as a survey.\u003c/p>\n\u003ch2 id=\"p-about-code\">Code\u003c/h2>\n\u003cp>isoscape is written in TypeScript and runs directly on Node 22.18 or newer, with no runtime\ndependencies and no build step. \u003ccode>package.json\u003c/code> declares the MIT licence. \u003ccode>CLAUDE.md\u003c/code> sets out the conventions for changing the code, and the README covers\ncommands, region configs and adding a page like this one.\u003c/p>","headings":[{"level":2,"id":"how-it-was-made","text":"How it was made"},{"level":2,"id":"try-it-yourself","text":"Try it yourself"},{"level":2,"id":"contact","text":"Contact"},{"level":2,"id":"inspiration","text":"Inspiration"},{"level":2,"id":"data","text":"Data"},{"level":2,"id":"sharing-a-picture","text":"Sharing a picture"},{"level":2,"id":"code","text":"Code"}]}]</script>
<script>
(() => {
  const builds = JSON.parse(document.getElementById('builds').textContent)
  const byId = new Map(builds.map((b) => [b.id, b]))
  const $ = (id) => document.getElementById(id)
  const stage = $('stage'), imgA = $('imgA'), imgB = $('imgB'), clipB = $('clipB'), divider = $('divider')
  const state = { a: null, b: null, compare: false, zoom: 1, panX: 0, panY: 0, split: 0.5, filter: '', tab: 'details', page: null, refit: false, pendingView: null }
  const pages = JSON.parse(document.getElementById('pagesData').textContent)
  const pageBySlug = new Map(pages.map((p) => [p.slug, p]))
  const site = JSON.parse(document.getElementById('site').textContent)

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const ago = (iso) => {
    const s = (Date.now() - new Date(iso).getTime()) / 1000
    if (s < 60) return 'just now'
    if (s < 3600) return Math.round(s / 60) + 'm ago'
    if (s < 86400) return Math.round(s / 3600) + 'h ago'
    if (s < 86400 * 14) return Math.round(s / 86400) + 'd ago'
    return new Date(iso).toLocaleDateString()
  }
  const when = (iso) => new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })
  const mb = (n) => (n / 1e6).toFixed(2) + ' MB' + (n > 9e6 ? ' <span class="big" title="Over 9 MB: slow to open in a browser">⚠️</span>' : '')
  const label = (b) => b.note || (b.git ? b.git.subject : b.region)

  // ---- nav ------------------------------------------------------------------------------------
  const visible = () => {
    const q = state.filter.toLowerCase().trim()
    if (!q) return builds
    return builds.filter((b) => [b.region, b.title, b.palette, b.note, b.git && b.git.commit, b.git && b.git.subject, b.name].join(' ').toLowerCase().includes(q))
  }
  const renderList = () => {
    const list = visible()
    $('count').textContent = builds.length + (builds.length === 1 ? ' build' : ' builds')
    const groups = new Map()
    for (const b of list) {
      if (!groups.has(b.region)) groups.set(b.region, [])
      groups.get(b.region).push(b)
    }
    let html = ''
    for (const [region, items] of groups) {
      // A dated series reads in time order, oldest first.
      if (items[0].time) items.sort((x, y) => ((x.time ? x.time.year : 1e9) - (y.time ? y.time.year : 1e9)) || y.createdAt.localeCompare(x.createdAt))
      html += '<h2>' + esc((items[0].config && items[0].config.title) || items[0].title || region) + '<small>' + esc(region) + '</small></h2>'
      for (const b of items) {
        const cls = 'build' + (state.a === b.id ? ' a' : '') + (state.compare && state.b === b.id ? ' b' : '')
        const pic = b.files.thumb
          ? '<img class="thumb" loading="lazy" src="' + esc(b.files.thumb) + '" alt="">'
          : '<div class="swatch" style="background:' + esc(b.sky) + '">' + esc(b.palette) + '</div>'
        const ab = state.a === b.id ? '<span class="tag ab">A</span>' : state.compare && state.b === b.id ? '<span class="tag ab">B</span>' : ''
        html += '<button class="' + cls + '" data-id="' + esc(b.id) + '">' + pic +
          '<div><div class="top">' + ab + (b.time ? '<span class="tag yr">' + esc(b.time.year) + '</span>' : '') + '<span class="tag">' + esc(b.palette) + '</span>' +
          (b.config && b.config.terrain && b.config.terrain.enabled !== false ? '<span class="tag">terrain</span>' : '') +
          '<time datetime="' + esc(b.createdAt) + '">' + ago(b.createdAt) + '</time></div>' +
          '<div class="note" title="' + esc(label(b)) + '">' + esc(label(b)) + '</div>' +
          '<div class="sub">' + (b.git ? esc(b.git.commit) + (b.git.dirty ? '<span class="dirty">*</span>' : '') : '') + ' · ' + mb(b.bytes) + '</div></div></button>'
      }
    }
    $('list').innerHTML = html || '<p style="padding:12px;color:var(--dim)">No builds match.</p>'
    const cur = $('list').querySelector('.build.a')
    if (cur) cur.scrollIntoView({ block: 'nearest' })
  }
  $('list').addEventListener('click', (e) => {
    const el = e.target.closest('.build')
    if (!el) return
    const leaving = state.page !== null
    if (leaving) closePage()
    if (e.altKey || e.metaKey || e.shiftKey) { state.b = el.dataset.id; state.compare = true }
    else select(el.dataset.id, false)
    update(leaving)
  })
  $('filter').addEventListener('input', (e) => { state.filter = e.target.value; renderList() })

  // ---- viewer ---------------------------------------------------------------------------------
  const place = (img, b) => {
    const vb = b.viewBox
    img.style.left = state.panX + vb[0] * state.zoom + 'px'
    img.style.top = state.panY + vb[1] * state.zoom + 'px'
    img.style.width = vb[2] * state.zoom + 'px'
    img.style.height = vb[3] * state.zoom + 'px'
  }
  const layout = () => {
    const a = byId.get(state.a)
    if (!a) return
    place(imgA, a)
    const b = state.compare ? byId.get(state.b) : null
    clipB.style.display = b ? 'block' : 'none'
    divider.style.display = b ? 'block' : 'none'
    if (b) {
      place(imgB, b)
      const x = stage.clientWidth * state.split
      clipB.style.clipPath = 'inset(0 0 0 ' + x + 'px)'
      divider.style.left = x + 'px'
    }
    $('zoom').textContent = Math.round(state.zoom * 100) + '%'
    scheduleHash()
  }
  // The zoom at which the whole image fits the stage; the URL's zoom is relative to it.
  const fitZoom = (vb) => Math.min(stage.clientWidth / vb[2], stage.clientHeight / vb[3]) * 0.94
  // The current view, resolution-independent: the visible centre in viewBox units, zoom / fit.
  const viewOf = () => {
    const a = byId.get(state.a)
    const w = stage.clientWidth, h = stage.clientHeight
    if (!a || w === 0 || h === 0) return null
    return { cx: (w / 2 - state.panX) / state.zoom, cy: (h / 2 - state.panY) / state.zoom, z: state.zoom / fitZoom(a.viewBox) }
  }
  const applyView = (v) => {
    const a = byId.get(state.a)
    const w = stage.clientWidth, h = stage.clientHeight
    if (!a || w === 0 || h === 0) return
    state.zoom = Math.min(40, Math.max(0.02, fitZoom(a.viewBox) * v.z))
    state.panX = w / 2 - v.cx * state.zoom
    state.panY = h / 2 - v.cy * state.zoom
    layout()
  }
  const fit = () => {
    const a = byId.get(state.a)
    if (!a) return
    const vb = a.viewBox
    const w = stage.clientWidth, h = stage.clientHeight
    // Hidden behind a page: fit when the viewer is next shown.
    if (w === 0 || h === 0) { state.refit = true; return }
    state.zoom = fitZoom(vb)
    state.panX = (w - vb[2] * state.zoom) / 2 - vb[0] * state.zoom
    state.panY = (h - vb[3] * state.zoom) / 2 - vb[1] * state.zoom
    layout()
  }
  const zoomAt = (mx, my, k) => {
    const ux = (mx - state.panX) / state.zoom
    const uy = (my - state.panY) / state.zoom
    state.zoom = Math.min(40, Math.max(0.02, state.zoom * k))
    state.panX = mx - ux * state.zoom
    state.panY = my - uy * state.zoom
    layout()
  }
  const actual = () => {
    const r = stage.getBoundingClientRect()
    zoomAt(r.width / 2, r.height / 2, 1 / state.zoom)
  }
  stage.addEventListener('wheel', (e) => {
    e.preventDefault()
    const r = stage.getBoundingClientRect()
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015))
  }, { passive: false })
  let drag = null
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#toolbar')) return
    drag = { x: e.clientX, y: e.clientY, divider: e.target === divider }
    stage.setPointerCapture(e.pointerId)
    if (!drag.divider) stage.classList.add('dragging')
  })
  stage.addEventListener('pointermove', (e) => {
    if (!drag) return
    if (drag.divider) {
      const r = stage.getBoundingClientRect()
      state.split = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))
    } else {
      state.panX += e.clientX - drag.x
      state.panY += e.clientY - drag.y
      drag.x = e.clientX
      drag.y = e.clientY
    }
    layout()
  })
  stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('dragging') })
  stage.addEventListener('dblclick', (e) => { if (!e.target.closest('#toolbar')) fit() })
  // When the stage changes size (the info panel opens, closes or changes tab), keep the point at
  // its centre where it was.
  let stageSize = null
  new ResizeObserver(() => {
    const w = stage.clientWidth, h = stage.clientHeight
    if (stageSize && stageSize[0] > 0 && stageSize[1] > 0 && w > 0 && h > 0) {
      state.panX += (w - stageSize[0]) / 2
      state.panY += (h - stageSize[1]) / 2
    }
    stageSize = [w, h]
    layout()
  }).observe(stage)

  const load = (img, b) => {
    if (img.dataset.id === b.id) return
    img.dataset.id = b.id
    $('loading').style.display = 'block'
    img.onload = img.onerror = () => { $('loading').style.display = 'none' }
    img.src = b.files.svg
  }

  // ---- info -------------------------------------------------------------------------------------
  const STAT_ORDER = ['buildings', 'footprintsAdded', 'heightFromTag', 'heightFromModel', 'heightFromLevels', 'heightGuessed', 'bridgePieces', 'ground', 'ribbons', 'elevationDatum', 'elevationTop', 'rapidCells', 'contourSegments', 'strips', 'features']
  const statKeys = (...bs) => {
    const keys = new Set()
    for (const b of bs) for (const k of Object.keys(b.stats || {})) keys.add(k)
    return [...STAT_ORDER.filter((k) => keys.has(k)), ...[...keys].filter((k) => !STAT_ORDER.includes(k)).sort()]
  }
  const fmt = (v) => (v === undefined ? '–' : typeof v === 'number' ? (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(2)) : esc(v))
  const renderInfo = () => {
    const a = byId.get(state.a)
    if (!a) { $('infoTitle').textContent = ''; $('infoBody').innerHTML = ''; $('links').innerHTML = ''; return }
    const b = state.compare ? byId.get(state.b) : null
    $('infoTitle').textContent = b ? a.title + '  ·  A vs B' : a.title
    $('links').innerHTML = '<a href="' + esc(a.files.svg) + '" target="_blank">Open A’s SVG ↗</a>' +
      (b ? '<a href="' + esc(b.files.svg) + '" target="_blank">Open B’s SVG ↗</a>' : '') +
      (site.latestPages ? '<a href="' + esc(a.name) + '.html" target="_blank" title="The latest build of this region, with hover labels">Latest page ↗</a>' : '') +
      (() => { const L = site.shop && site.shop.links; if (!L) return ''; const k = Object.keys(L).filter((p) => a.region.startsWith(p)).sort((x, y) => y.length - x.length)[0]; return k ? '<a class="buy" href="' + esc(L[k]) + '" target="_blank" rel="noopener">Buy a print ↗</a>' : '' })()
    $('info').classList.toggle('made', state.tab === 'made')
    for (const t of $('tabs').children) t.classList.toggle('on', t.dataset.tab === state.tab)
    if (state.tab === 'made') {
      $('infoBody').className = 'body stories'
      $('infoBody').innerHTML = story(a, b ? 'A' : '') + (b ? story(b, 'B') : '')
      return
    }
    $('infoBody').className = 'body'
    const about = (x, tag) =>
      '<dl>' +
      (tag ? '<dt>' + tag + '</dt><dd><b>' + esc(label(x)) + '</b></dd>' : '<dt>note</dt><dd>' + (x.note ? '<b>' + esc(x.note) + '</b>' : '<span style="color:var(--faint)">none</span>') + '</dd>') +
      '<dt>built</dt><dd>' + when(x.createdAt) + '</dd>' +
      '<dt>commit</dt><dd class="mono">' + (x.git ? esc(x.git.commit) + (x.git.dirty ? ' <span class="dirty">+ uncommitted changes</span>' : '') + '<br><span style="color:var(--dim)">' + esc(x.git.subject) + '</span>' : '–') + '</dd>' +
      '<dt>region</dt><dd class="mono">' + esc(x.region) + '</dd>' +
      '<dt>palette</dt><dd>' + esc(x.palette) + '</dd>' +
      '<dt>bearing</dt><dd>' + (typeof x.bearing === 'number' ? x.bearing.toFixed(1) + '°' : '–') + '</dd>' +
      '<dt>size</dt><dd>' + mb(x.bytes) + ' · ' + Math.round(x.viewBox[2]) + '×' + Math.round(x.viewBox[3]) + ' · ' + x.ms + ' ms</dd>' +
      '</dl>'
    let stats
    if (b) {
      stats = '<table><tr><th>stat</th><th>A</th><th>B</th><th>Δ</th></tr>' + statKeys(a, b).map((k) => {
        const va = (a.stats || {})[k], vb = (b.stats || {})[k]
        const d = typeof va === 'number' && typeof vb === 'number' ? vb - va : undefined
        const cls = d === undefined || d === 0 ? '' : d > 0 ? 'up' : 'down'
        return '<tr><td>' + esc(k) + '</td><td>' + fmt(va) + '</td><td>' + fmt(vb) + '</td><td class="' + cls + '">' + (d === undefined || d === 0 ? '' : (d > 0 ? '+' : '') + fmt(d)) + '</td></tr>'
      }).join('') + '</table>'
    } else {
      stats = '<table>' + statKeys(a).map((k) => '<tr><td>' + esc(k) + '</td><td>' + fmt(a.stats[k]) + '</td></tr>').join('') + '</table>'
    }
    const configDiff = (x, y) => {
      const flat = (o, p = '') => Object.entries(o).flatMap(([k, v]) => v && typeof v === 'object' && !Array.isArray(v) ? flat(v, p + k + '.') : [[p + k, JSON.stringify(v)]])
      const fx = new Map(flat(x.config)), fy = new Map(flat(y.config))
      const keys = [...new Set([...fx.keys(), ...fy.keys()])].filter((k) => fx.get(k) !== fy.get(k) && k !== 'name')
      if (keys.length === 0) return '<p style="margin:0;color:var(--dim)">Same settings.</p>'
      return '<table><tr><th>setting</th><th>A</th><th>B</th></tr>' + keys.map((k) => '<tr><td>' + esc(k) + '</td><td class="mono">' + esc(fx.get(k) ?? '–') + '</td><td class="mono">' + esc(fy.get(k) ?? '–') + '</td></tr>').join('') + '</table>'
    }
    $('infoBody').innerHTML =
      '<div><h3>' + (b ? 'A' : 'Build') + '</h3>' + about(a, b ? 'A' : '') + (b ? '<h3 style="margin-top:12px">B</h3>' + about(b, 'B') : '') + '</div>' +
      '<div><h3>Measures</h3>' + stats + '</div>' +
      '<div class="settings"><h3>' + (b ? 'Settings that differ' : 'Settings') + '</h3>' + (b ? configDiff(a, b) : '<pre>' + esc(JSON.stringify(a.config, null, 2)) + '</pre>') + '</div>'
  }
  // ---- how this view was made ------------------------------------------------------------------
  // A build's own story, written from its meta.json. Anything an older build did not record is
  // said to be unknown rather than guessed.
  const how = (id, text) => pageBySlug.has('how-its-made') ? '<a href="#/how-its-made/' + id + '">' + text + '</a>' : text
  const KNOWN = new Set(['features', 'ground', 'ribbons', 'buildings', 'heightFromTag', 'heightFromModel', 'heightFromLevels', 'heightGuessed', 'footprintsAdded', 'bridgePieces', 'elevationDatum', 'elevationTop', 'rapidCells', 'contourSegments', 'strips', 'coastWays', 'year', 'newSincePrevious', 'landmarks', 'curated', 'datedCurated', 'datedOsm', 'datedParcel', 'undatedToday', 'traced', 'tracedEndMap', 'tracedEndRebuilt', 'tracedEndHighway', 'tracedEndAssumed'])
  const POINTS = ['north', 'north-northeast', 'northeast', 'east-northeast', 'east', 'east-southeast', 'southeast', 'south-southeast', 'south', 'south-southwest', 'southwest', 'west-southwest', 'west', 'west-northwest', 'northwest', 'north-northwest']
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v)
  const int = (v) => Math.round(v).toLocaleString()
  const dist = (m) => (m >= 1000 ? +(m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m')
